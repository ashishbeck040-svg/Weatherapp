<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Lab — Image Classifier</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <span class="brand-name">Vision Lab</span>
    </div>
    <p class="tagline">Specimen classifier — powered by MobileNet</p>
  </header>

  <main class="lab">

    <!-- ===== Input source tabs ===== -->
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabUpload" role="tab" aria-selected="true">Upload Image</button>
      <button class="tab" id="tabWebcam" role="tab" aria-selected="false">Use Webcam</button>
    </div>

    <div class="lab-grid">

      <!-- ===== Viewfinder (image / webcam / scan animation) ===== -->
      <section class="viewfinder" id="viewfinder">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="scan-line" id="scanLine"></div>

        <!-- Upload panel -->
        <div class="panel" id="uploadPanel">
          <img id="preview" class="preview hidden" alt="Uploaded specimen preview" />
          <div class="dropzone" id="dropzone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <p>Drop an image here, or click to browse</p>
            <input type="file" id="fileInput" accept="image/*" hidden />
          </div>
        </div>

        <!-- Webcam panel -->
        <div class="panel hidden" id="webcamPanel">
          <video id="webcamVideo" autoplay playsinline muted></video>
          <canvas id="webcamCanvas" class="hidden"></canvas>
        </div>
      </section>

      <!-- ===== Readout (results) ===== -->
      <section class="readout">
        <p class="readout-label">Analysis</p>

        <p class="status" id="status">Loading model…</p>

        <div class="actions">
          <button class="btn primary" id="classifyBtn" disabled>Classify specimen</button>
          <button class="btn ghost hidden" id="webcamStartBtn">Start webcam</button>
        </div>

        <ol class="results" id="results"></ol>
      </section>

    </div>
  </main>

  <!-- TensorFlow.js + pretrained MobileNet model (loaded from CDN, no API key needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
