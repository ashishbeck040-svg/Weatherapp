<!DOCTYPE html>

<html lang="en">

<style>
/* =========================================================
   DESIGN TOKENS
   Theme: "Almanac" â€” an old weather-observatory feel.
   Deep dusk-indigo sky, parchment text, amber sun / teal rain
   accents. Serif (Fraunces) for big numbers, sans (Work Sans)
   for everything else.
========================================================= */
:root {
  --indigo-950: #141a4b;
  --indigo-900: #37229f;
  --indigo-800: #3742b8;
  --parchment: #6a8057;
  --parchment-dim: #9097c6;
  --amber: #8e846e;
  --teal: #6bc5b8;
  --danger: #7a1313;

  --radius: 20px;
  --font-display: "Fraunces", serif;
  --font-body: "Work Sans", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--parchment);
  min-height: 100vh;
}

/* The "sky" is the full-page gradient background.
   Its class changes via JS depending on weather (clear / cloudy / rain)
   so the whole page mood shifts with the forecast. */
.sky {
  min-height: 100vh;
  padding: 32px 20px 60px;
  background: linear-gradient(160deg, var(--indigo-950) 0%, var(--indigo-900) 55%, var(--indigo-800) 100%);
  transition: background 0.6s ease;
}

.sky.rainy {
  background: linear-gradient(160deg, #14213d 0%, #1d2b4f 55%, #26355e 100%);
}

.sky.clear {
  background: linear-gradient(160deg, #1c1f3a 0%, #3a2f56 55%, #52406b 100%);
}

/* ===================== HEADER ===================== */
.topbar {
  max-width: 720px;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.02em;
}

.brand-mark {
  color: var(--amber);
  font-size: 22px;
}

.search-form {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  padding: 6px 8px 6px 18px;
  flex: 1;
  min-width: 240px;
  max-width: 420px;
}

.search-form input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 15px;
}

.search-form input::placeholder {
  color: var(--parchment-dim);
}

.search-form button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: var(--parchment);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease;
}

.search-form button:hover {
  background: var(--amber);
  color: var(--indigo-950);
}

/* ===================== STATUS (loading / error) ===================== */
.status {
  max-width: 720px;
  margin: 24px auto;
  text-align: center;
  color: var(--parchment-dim);
  font-size: 14px;
  min-height: 20px;
}

.status.error {
  color: var(--danger);
}

/* ===================== MAIN APP ===================== */
.app {
  max-width: 720px;
  margin: 20px auto 0;
}

.hidden { display: none; }

/* ---------- Current conditions card ---------- */
.current {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 32px;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  backdrop-filter: blur(6px);
}

.place {
  font-family: var(--font-display);
  font-size: 24px;
  margin: 0;
}

.datetime {
  margin: 4px 0 20px;
  font-size: 13px;
  color: var(--parchment-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.temp-row {
  display: flex;
  align-items: flex-start;
  gap: 4px;
}

.temp {
  font-family: var(--font-display);
  font-size: 84px;
  line-height: 1;
  font-weight: 500;
}

.unit {
  font-family: var(--font-display);
  font-size: 28px;
  margin-top: 10px;
  color: var(--parchment-dim);
}

.condition {
  font-size: 16px;
  margin: 8px 0 2px;
}

.feels-like {
  font-size: 13px;
  color: var(--parchment-dim);
  margin: 0;
}

.current-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.weather-icon {
  width: 64px;
  height: 64px;
  color: var(--amber);
}

.weather-icon svg { width: 100%; height: 100%; }

.stat-grid {
  display: flex;
  gap: 20px;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--parchment-dim);
}

.stat-value {
  font-size: 16px;
  margin-top: 2px;
}

/* ---------- Forecast row ---------- */
.forecast {
  margin-top: 24px;
}

.forecast-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--parchment-dim);
  margin: 0 0 10px 4px;
}

.forecast-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.forecast-day {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 16px 8px;
  text-align: center;
}

.forecast-day .day-name {
  font-size: 12px;
  color: var(--parchment-dim);
  margin: 0 0 8px;
}

.forecast-day .day-icon {
  width: 30px;
  height: 30px;
  margin: 0 auto 8px;
  color: var(--amber);
}

.forecast-day .day-icon svg { width: 100%; height: 100%; }

.forecast-day .day-temps {
  font-size: 13px;
  font-family: var(--font-display);
}

.forecast-day .day-temps .lo {
  color: var(--parchment-dim);
  margin-left: 4px;
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 640px) {
  .current { flex-direction: column; }
  .current-right { align-items: flex-start; flex-direction: row-reverse; width: 100%; justify-content: space-between; }
  .forecast-row { grid-template-columns: repeat(3, 1fr); }
  .forecast-day:nth-child(n+4) { display: none; }
  .temp { font-size: 64px; }
}

@media (max-width: 420px) {
  .forecast-row { grid-template-columns: repeat(2, 1fr); }
  .forecast-day:nth-child(3) { display: none; }
}
</style>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almanac — Weather Forecast</title>

  <!-- Google Fonts: Fraunces (serif, for big numbers/headings) + Work Sans (clean body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="sky" id="sky">

    <!-- ===== Header / Search ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">☉</span>
        <span class="brand-name">Almanac</span>
      </div>

      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="cityInput"
          placeholder="Search a city…"
          autocomplete="off"
          required
        />
        <button type="submit" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" id="locateBtn" title="Use my location" aria-label="Use my location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </header>

    <!-- ===== Status messages (loading / error) ===== -->
    <p class="status" id="status"></p>

    <!-- ===== Main content ===== -->
    <main id="app" class="app hidden">

      <!-- Current conditions -->
      <section class="current">
        <div class="current-left">
          <p class="place" id="placeName">—</p>
          <p class="datetime" id="dateTime">—</p>

          <div class="temp-row">
            <span class="temp" id="temp">—</span>
            <span class="unit">°C</span>
          </div>

          <p class="condition" id="condition">—</p>
          <p class="feels-like">Feels like <span id="feelsLike">—</span>°</p>
        </div>

        <div class="current-right">
          <div class="weather-icon" id="weatherIcon"></div>

          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">Humidity</span>
              <span class="stat-value" id="humidity">—%</span>
            </div>
            <div class="stat">
              <span class="stat-label">Wind</span>
              <span class="stat-value" id="wind">— km/h</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5-day forecast -->
      <section class="forecast">
        <p class="forecast-label">5-day outlook</p>
        <div class="forecast-row" id="forecastRow">
          <!-- forecast day cards injected by JS -->
        </div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>


<script>
/* =========================================================
   WEATHER APP — script.js
   Data source: Open-Meteo (https://open-meteo.com)
   - No API key required, generous free usage.
   - Two endpoints are used:
       1. Geocoding API  -> turns a city name into lat/lon
       2. Forecast API   -> turns lat/lon into current + daily weather
   ========================================================= */

// ---- Grab references to the DOM elements we'll update ----
const searchForm   = document.getElementById("searchForm");
const cityInput    = document.getElementById("cityInput");
const locateBtn    = document.getElementById("locateBtn");
const statusEl     = document.getElementById("status");
const appEl        = document.getElementById("app");
const skyEl        = document.getElementById("sky");

const placeNameEl  = document.getElementById("placeName");
const dateTimeEl   = document.getElementById("dateTime");
const tempEl       = document.getElementById("temp");
const conditionEl  = document.getElementById("condition");
const feelsLikeEl  = document.getElementById("feelsLike");
const humidityEl   = document.getElementById("humidity");
const windEl       = document.getElementById("wind");
const weatherIconEl = document.getElementById("weatherIcon");
const forecastRowEl = document.getElementById("forecastRow");


/* =========================================================
   WMO WEATHER CODE MAP
   Open-Meteo returns a numeric "weathercode" (WMO standard).
   We map each code to a human-readable label, an icon key,
   and a "mood" used to tint the page background.
   Reference: https://open-meteo.com/en/docs (see "WMO Weather codes")
========================================================= */
const WEATHER_CODES = {
  0:  { label: "Clear sky",        icon: "sun",   mood: "clear" },
  1:  { label: "Mainly clear",     icon: "sun",   mood: "clear" },
  2:  { label: "Partly cloudy",    icon: "cloud-sun", mood: "clear" },
  3:  { label: "Overcast",         icon: "cloud", mood: "cloudy" },
  45: { label: "Fog",              icon: "fog",   mood: "cloudy" },
  48: { label: "Depositing fog",   icon: "fog",   mood: "cloudy" },
  51: { label: "Light drizzle",    icon: "rain",  mood: "rainy" },
  53: { label: "Drizzle",          icon: "rain",  mood: "rainy" },
  55: { label: "Dense drizzle",    icon: "rain",  mood: "rainy" },
  61: { label: "Slight rain",      icon: "rain",  mood: "rainy" },
  63: { label: "Rain",             icon: "rain",  mood: "rainy" },
  65: { label: "Heavy rain",       icon: "rain",  mood: "rainy" },
  71: { label: "Slight snow",      icon: "snow",  mood: "cloudy" },
  73: { label: "Snow",             icon: "snow",  mood: "cloudy" },
  75: { label: "Heavy snow",       icon: "snow",  mood: "cloudy" },
  80: { label: "Rain showers",     icon: "rain",  mood: "rainy" },
  81: { label: "Rain showers",     icon: "rain",  mood: "rainy" },
  82: { label: "Violent showers",  icon: "rain",  mood: "rainy" },
  95: { label: "Thunderstorm",     icon: "storm", mood: "rainy" },
  96: { label: "Thunderstorm w/ hail", icon: "storm", mood: "rainy" },
  99: { label: "Thunderstorm w/ hail", icon: "storm", mood: "rainy" },
};

// Fallback for any code not in the table above
function describeWeather(code) {
  return WEATHER_CODES[code] || { label: "Unknown", icon: "cloud", mood: "cloudy" };
}

// ---- Simple hand-drawn line icons (as SVG strings) ----
const ICONS = {
  sun: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 1v3M12 20v3M23 12h-3M4 12H1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1M19.8 19.8l-2.1-2.1M6.3 6.3L4.2 4.2"/></g></svg>`,
  "cloud-sun": `<svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M8 2v1.6M13.6 8h-1.6M4 8H2.4M11.6 4.4l-1.1 1.1M4.4 11.6l1.1-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 20a4 4 0 0 1 .3-8 5.5 5.5 0 0 1 10.6 1.7A3.8 3.8 0 0 1 17 20H7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 19a4.5 4.5 0 0 1 .4-9 6 6 0 0 1 11.6 2A4 4 0 0 1 17.5 19H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  rain: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 15a4.5 4.5 0 0 1 .4-9 6 6 0 0 1 11.6 2A4 4 0 0 1 17.5 15H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 19l-1 2.5M12 19l-1 2.5M16 19l-1 2.5"/></g></svg>`,
  snow: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 14a4.5 4.5 0 0 1 .4-9 6 6 0 0 1 11.6 2A4 4 0 0 1 17.5 14H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 18v4M9 20l-1.6 1M9 20l1.6 1"/><path d="M15 18v4M15 20l-1.6 1M15 20l1.6 1"/></g></svg>`,
  fog: `<svg viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9h13M4 13h16M4 17h11"/></g></svg>`,
  storm: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 12a4.5 4.5 0 0 1 .4-9 6 6 0 0 1 11.6 2A4 4 0 0 1 17.5 12H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 13l-3 5h3l-2 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

function iconMarkup(key) {
  return ICONS[key] || ICONS.cloud;
}


/* =========================================================
   1. GEOCODING — turn "Tokyo" into { lat, lon, displayName }
========================================================= */
async function geocodeCity(cityName) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`;

  const res = await fetch(url);
  if (!res.ok) throw new Error("Geocoding request failed");

  const data = await res.json();

  // If Open-Meteo finds no matching place, `results` will be missing
  if (!data.results || data.results.length === 0) {
    throw new Error("CITY_NOT_FOUND");
  }

  const place = data.results[0];
  return {
    lat: place.latitude,
    lon: place.longitude,
    displayName: [place.name, place.admin1, place.country]
      .filter(Boolean) // drop any undefined parts (e.g. admin1 missing)
      .join(", "),
  };
}


/* =========================================================
   2. FORECAST — turn lat/lon into current + 5-day weather
========================================================= */
async function fetchForecast(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code",
    daily: "weather_code,temperature_2m_max,temperature_2m_min",
    timezone: "auto",   // let the API infer local time for that location
    forecast_days: 6,   // today + 5 more days
  });

  const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;

  const res = await fetch(url);
  if (!res.ok) throw new Error("Forecast request failed");

  return res.json();
}


/* =========================================================
   3. RENDERING — take the API data and update the page
========================================================= */
function renderWeather(displayName, data) {
  const current = data.current;
  const weather = describeWeather(current.weather_code);

  // --- Current conditions ---
  placeNameEl.textContent = displayName;
  dateTimeEl.textContent = new Date(current.time).toLocaleString(undefined, {
    weekday: "long", hour: "2-digit", minute: "2-digit",
  });

  tempEl.textContent = Math.round(current.temperature_2m);
  conditionEl.textContent = weather.label;
  feelsLikeEl.textContent = Math.round(current.apparent_temperature);
  humidityEl.textContent = `${current.relative_humidity_2m}%`;
  windEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
  weatherIconEl.innerHTML = iconMarkup(weather.icon);

  // Tint the whole page based on current conditions (clear / cloudy / rainy)
  skyEl.classList.remove("clear", "rainy");
  if (weather.mood !== "cloudy") skyEl.classList.add(weather.mood);

  // --- 5-day forecast ---
  forecastRowEl.innerHTML = ""; // clear any previous cards

  const days = data.daily.time;      // array of date strings
  const codes = data.daily.weather_code;
  const maxTemps = data.daily.temperature_2m_max;
  const minTemps = data.daily.temperature_2m_min;

  // Start at index 1 to skip "today" (already shown above) and show the next 5 days
  for (let i = 1; i < days.length; i++) {
    const dayWeather = describeWeather(codes[i]);
    const dayName = new Date(days[i]).toLocaleDateString(undefined, { weekday: "short" });

    const card = document.createElement("div");
    card.className = "forecast-day";
    card.innerHTML = `
      <p class="day-name">${dayName}</p>
      <div class="day-icon">${iconMarkup(dayWeather.icon)}</div>
      <p class="day-temps">${Math.round(maxTemps[i])}°<span class="lo">${Math.round(minTemps[i])}°</span></p>
    `;
    forecastRowEl.appendChild(card);
  }

  appEl.classList.remove("hidden");
}


/* =========================================================
   4. STATUS HELPERS — loading / error messages
========================================================= */
function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle("error", isError);
}

function clearStatus() {
  statusEl.textContent = "";
  statusEl.classList.remove("error");
}


/* =========================================================
   5. MAIN FLOW — ties geocoding + forecast + rendering together
========================================================= */
async function loadWeatherForCity(cityName) {
  try {
    appEl.classList.add("hidden");
    setStatus(`Searching for "${cityName}"…`);

    const place = await geocodeCity(cityName);

    setStatus("Fetching forecast…");
    const data = await fetchForecast(place.lat, place.lon);

    renderWeather(place.displayName, data);
    clearStatus();

  } catch (err) {
    if (err.message === "CITY_NOT_FOUND") {
      setStatus(`Couldn't find a place called "${cityName}". Check the spelling and try again.`, true);
    } else {
      setStatus("Something went wrong reaching the weather service. Check your connection and try again.", true);
    }
    console.error(err);
  }
}

async function loadWeatherForCoords(lat, lon, fallbackName = "Your location") {
  try {
    appEl.classList.add("hidden");
    setStatus("Fetching forecast for your location…");

    const data = await fetchForecast(lat, lon);
    renderWeather(fallbackName, data);
    clearStatus();

  } catch (err) {
    setStatus("Couldn't load weather for your location. Try searching a city instead.", true);
    console.error(err);
  }
}


/* =========================================================
   6. EVENT LISTENERS
========================================================= */
searchForm.addEventListener("submit", (e) => {
  e.preventDefault(); // stop the page from reloading
  const city = cityInput.value.trim();
  if (city) loadWeatherForCity(city);
});

locateBtn.addEventListener("click", () => {
  if (!navigator.geolocation) {
    setStatus("Geolocation isn't supported by your browser.", true);
    return;
  }

  setStatus("Getting your location…");
  navigator.geolocation.getCurrentPosition(
    (position) => {
      const { latitude, longitude } = position.coords;
      loadWeatherForCoords(latitude, longitude);
    },
    () => setStatus("Location access was denied. Try searching a city instead.", true)
  );
});

// Load a default city on first page load so the app isn't empty
window.addEventListener("DOMContentLoaded", () => {
  loadWeatherForCity("New Delhi");
});

</script>
</body>
  
</html>
